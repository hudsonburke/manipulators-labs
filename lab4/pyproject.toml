[project]
name = "manipulators-lab4"
version = "0.1.0"
description = "Native OpenCV and MediaPipe arm tracking for a Dockerized URSim"
requires-python = ">=3.12,<3.13"
dependencies = [
    # MediaPipe dropped Intel macOS wheels after 0.10.21; that release needs NumPy 1.x.
    "numpy>=1.26.4,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=2.5.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-contrib-python>=4.11.0.86,<4.12; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-contrib-python>=5.0.0.93; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "mediapipe==0.10.21; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "mediapipe>=1.2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "ur-rtde>=1.6.5",
]

[project.optional-dependencies]
browser = [
    "aiohttp>=3.13,<4",
    "pillow>=11",
]

[tool.uv]
# Keep wheel-only upstream packages resolvable on every native host tested in CI.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Newer SentencePiece releases have a source archive but no Intel macOS wheel.
constraint-dependencies = [
    "sentencepiece<0.2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# ur-rtde publishes no macOS wheels, so wheels/ carries prebuilt ones built by
# .github/workflows/ur-rtde-macos-wheel.yml; the marker picks the matching wheel
# and every other platform resolves ur-rtde from PyPI.
[tool.uv.sources]
ur-rtde = [
    { path = "wheels/ur_rtde-1.6.5-cp312-cp312-macosx_15_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
    { path = "wheels/ur_rtde-1.6.5-cp312-cp312-macosx_15_0_x86_64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
]
