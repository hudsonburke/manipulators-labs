[project]
name = "manipulators-lab4"
version = "0.1.0"
description = "Native OpenCV and MediaPipe arm tracking for a Dockerized URSim"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "opencv-contrib-python>=5.0.0.93",
    "mediapipe>=1.2.2",
]

# Task 3 only. ur-rtde has no macOS wheels, so it stays out of the default sync
# (Tasks 1-2) where it would otherwise trigger a C++ build on every Mac.
[project.optional-dependencies]
robot = ["ur-rtde>=1.6.5"]
