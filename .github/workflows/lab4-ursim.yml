name: Lab 4 URSim motion

on:
  push:
    paths:
      - 'lab4/**'
      - '.github/workflows/lab4-ursim.yml'
      - '.devcontainer/**'
  pull_request:
    paths:
      - 'lab4/**'
      - '.github/workflows/lab4-ursim.yml'
      - '.devcontainer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ursim:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: lab4
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      URSIM_HOST: '127.0.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: lab4/uv.lock
      - name: Install native host environment
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          uv sync --locked --python 3.12 2>&1 | tee ci-artifacts/install.log
          uv run python check_setup.py 2>&1 | tee ci-artifacts/environment.log
      - name: Install Linux image runtimes and CI GUI tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libegl1 libgles2 libgl1 libglib2.0-0 tesseract-ocr
          # Isolated CI dependency: never add VNC automation to student manifests.
          uv venv --python 3.12 "$RUNNER_TEMP/lab4-vnc"
          uv pip install --python "$RUNNER_TEMP/lab4-vnc/bin/python" vncdotool==1.4.2
      - name: Start disposable compose simulator
        timeout-minutes: 5
        run: |
          set -o pipefail
          docker compose pull 2>&1 | tee ci-artifacts/pull.log
          docker compose up -d 2>&1 | tee ci-artifacts/start.log
      - name: Confirm fresh simulator safety through real PolyScope UI
        timeout-minutes: 4
        env:
          LAB4_URSIM_CI: '1'
        run: |
          set -o pipefail
          container="$(docker compose ps -q ursim_cb3)"
          test -n "$container"
          # Official CB3 image: Docker-IP:5900, not a new host/public publication.
          # https://hub.docker.com/r/universalrobots/ursim_cb3
          # Capture the actual no-password x11vnc invocation/entrypoint as evidence;
          # do not assume another URSim distribution's password applies.
          docker exec "$container" sh -c 'cat /entrypoint.sh; printf "\n=== Processes ===\n"; ps -ef' \
            > ci-artifacts/gui-server.txt
          container_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")"
          # Screenshot/OCR locates the exact observed safety dialog and its button.
          # No guessed coordinates, config files, RTDE workaround, or physical robot.
          timeout --signal=TERM --kill-after=5s 230s \
            "$RUNNER_TEMP/lab4-vnc/bin/python" tests/ursim_confirm_safety.py \
              --container-ip "$container_ip" 2>&1 | tee ci-artifacts/safety-gui.log
      - name: Verify real joint motion and controller gating
        timeout-minutes: 9
        env:
          LAB4_URSIM_CI: '1'
        run: |
          set -o pipefail
          # GUI setup may already power on/release brakes through simulator preparation.
          # This native scenario uploads its control script and commands simulated motion.
          # The script bounds readiness and each assertion; timeout also bounds native calls.
          timeout --signal=TERM --kill-after=15s 480s \
            uv run python tests/ursim_smoke.py 2>&1 | tee ci-artifacts/motion.log
          uv run python check_setup.py --robot --host 127.0.0.1 \
            2>&1 | tee ci-artifacts/robot-diagnostic.log
      - name: Verify actual Codespaces image and internal simulator DNS
        timeout-minutes: 8
        run: |
          set -o pipefail
          docker build --file ../.devcontainer/Dockerfile --tag lab4-devcontainer-ci ../.devcontainer \
            2>&1 | tee ci-artifacts/devcontainer-build.log
          container="$(docker compose ps -q ursim_cb3)"
          test -n "$container"
          mapfile -t networks < <(docker inspect \
            --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' \
            "$container" | sed '/^$/d')
          test "${#networks[@]}" -eq 1
          # Reuse the real compose service, with no additional simulator or ports.
          # Keep the checkout read-only and install a disposable project .venv.
          timeout --signal=TERM --kill-after=15s 420s docker run --rm \
            --network "${networks[0]}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --tmpfs /workspace/lab4/.venv:exec,size=2g \
            --workdir /workspace/lab4 \
            --env UV_CACHE_DIR=/tmp/lab4-uv-cache --env UV_LINK_MODE=copy \
            lab4-devcontainer-ci bash -lc '
              set -eu
              uv sync --locked --extra browser --python 3.12
              uv run --extra browser python -c "import cv2, mediapipe, aiohttp"
              uv run --extra browser python check_setup.py --robot --host ursim_cb3
            ' 2>&1 | tee ci-artifacts/devcontainer-doctor.log
      - name: Install optional browser environment and pinned Chromium
        timeout-minutes: 5
        run: |
          set -o pipefail
          uv sync --locked --extra browser --python 3.12 \
            2>&1 | tee ci-artifacts/browser-install.log
          # Playwright stays in uv's isolated --with environment, not student manifests.
          uv run --extra browser --with playwright==1.58.0 \
            python -m playwright install --with-deps chromium \
            2>&1 | tee ci-artifacts/chromium-install.log
      - name: Verify browser protocol checks explicitly
        timeout-minutes: 3
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 150s \
            uv run --extra browser python -m unittest discover -s tests -p browser_checks.py -v \
            2>&1 | tee ci-artifacts/browser-checks.log
      - name: Verify real Chromium camera and URSim joint motion
        timeout-minutes: 7
        env:
          LAB4_URSIM_CI: '1'
        run: |
          set -o pipefail
          # Existing native controller has completed its finally/close before this starts.
          # Real MediaPipe fixture/model + fake camera device, not mocked inference.
          timeout --signal=TERM --kill-after=15s 360s \
            uv run --extra browser --with playwright==1.58.0 python tests/browser_smoke.py \
            2>&1 | tee ci-artifacts/browser-motion.log
      - name: Collect simulator diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts
          docker compose ps -a > ci-artifacts/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > ci-artifacts/compose.log 2>&1 || true
          container="$(docker compose ps -a -q ursim_cb3)"
          if [ -n "$container" ]; then
            docker inspect "$container" > ci-artifacts/container-inspect.json 2>&1 || true
            # The failed run's compose stdout contained only its startup banner.
            # Discover controller/PolyScope logs inside the image rather than
            # assuming one release-specific URControl log location.
            docker exec "$container" sh -c '
              printf "=== Container processes ===\n"
              ps -ef
              printf "\n=== Controller and PolyScope logs (last 1 MiB per file) ===\n"
              find /ursim /var/log /tmp -maxdepth 6 -type f \
                \( -iname "*.log" -o -iname "*.log.*" -o -iname "*.out" \
                   -o -iname "*.err" -o -name "log_history*" \
                   -o -name "log_messages*" -o -name "hs_err_pid*" \) \
                -exec sh -c '"'"'
                  for path do
                    printf "\n=== %s ===\n" "$path"
                    tail -c 1048576 "$path"
                    printf "\n"
                  done
                '"'"' sh {} +
            ' > ci-artifacts/container-internal.log 2>&1 || true
            docker exec "$container" sh -c 'ss -tanp || netstat -tanp' \
              > ci-artifacts/container-connections.txt 2>&1 || true
            sudo ss -tanp > ci-artifacts/host-connections.txt 2>&1 || true
          fi
      - name: Remove disposable simulator
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab4-ursim-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lab4/ci-artifacts/
            !lab4/ci-artifacts/browser/*.y4m
          if-no-files-found: warn
          retention-days: 14
